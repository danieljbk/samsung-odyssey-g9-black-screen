<svg viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" font-size="11" fill="#26262b">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b76"/>
    </marker>
  </defs>
  <g stroke="#6b6b76" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="44" x2="150" y2="62"/>
    <line x1="150" y1="122" x2="150" y2="142"/>
    <line x1="290" y1="166" x2="328" y2="166"/>
    <line x1="150" y1="190" x2="150" y2="214"/>
    <line x1="150" y1="266" x2="150" y2="286"/>
    <line x1="150" y1="338" x2="150" y2="358"/>
    <line x1="290" y1="382" x2="328" y2="382"/>
    <line x1="150" y1="406" x2="150" y2="430"/>
    <line x1="150" y1="474" x2="150" y2="494"/>
    <line x1="290" y1="518" x2="328" y2="518"/>
    <line x1="150" y1="542" x2="150" y2="566"/>
    <path d="M420,206 L420,240 L294,240"/>
  </g>
  <g fill="#6b6b76" font-size="10" font-weight="600">
    <text x="300" y="160">Yes</text>
    <text x="158" y="206">No</text>
    <text x="300" y="376">Short found</text>
    <text x="158" y="422">No short, or no meter</text>
    <text x="300" y="512">Yes</text>
    <text x="158" y="558">No</text>
  </g>
  <!-- start -->
  <rect x="20" y="8" width="260" height="36" rx="18" fill="#26262b" stroke="none"/>
  <text x="150" y="30" text-anchor="middle" fill="#ffffff" font-weight="600">Backlight on, black screen, no menu</text>
  <!-- step 1 -->
  <rect x="10" y="64" width="280" height="58" rx="6" fill="#f7f7f9" stroke="#cfcfd6"/>
  <text x="22" y="82" font-weight="600">1. Try the workarounds</text>
  <text x="22" y="98" fill="#4a4a52">Warm the back with a hair dryer, or leave the</text>
  <text x="22" y="112" fill="#4a4a52">monitor on for hours; try HDMI. Then power-cycle.</text>
  <!-- question 1 -->
  <rect x="10" y="144" width="280" height="46" rx="6" fill="#ffffff" stroke="#3b47b8" stroke-width="1.5"/>
  <text x="150" y="171" text-anchor="middle" font-weight="600" fill="#3b47b8">Does the picture come back?</text>
  <rect x="330" y="130" width="180" height="76" rx="6" fill="#eef0fb" stroke="#3b47b8"/>
  <text x="342" y="148" font-weight="600">Temperature-dependent fault</text>
  <text x="342" y="164" fill="#4a4a52">It tends to return. For a</text>
  <text x="342" y="178" fill="#4a4a52">lasting fix, carry on from</text>
  <text x="342" y="192" fill="#4a4a52">step 2.</text>
  <!-- step 2 -->
  <rect x="10" y="216" width="280" height="50" rx="6" fill="#f7f7f9" stroke="#cfcfd6"/>
  <text x="22" y="234" font-weight="600">2. Check the warranty</text>
  <text x="22" y="250" fill="#4a4a52">Opening the monitor ends any warranty claim.</text>
  <!-- step 3 -->
  <rect x="10" y="288" width="280" height="50" rx="6" fill="#f7f7f9" stroke="#cfcfd6"/>
  <text x="22" y="306" font-weight="600">3. Open the back and find the thermistor</text>
  <text x="22" y="322" fill="#4a4a52">Figures 2 and 3 show where to look.</text>
  <!-- question 2 -->
  <rect x="10" y="360" width="280" height="46" rx="6" fill="#ffffff" stroke="#3b47b8" stroke-width="1.5"/>
  <text x="150" y="380" text-anchor="middle" font-weight="600" fill="#3b47b8">4. With a meter: is there a short on</text>
  <text x="150" y="395" text-anchor="middle" font-weight="600" fill="#3b47b8">the boards under the white strip?</text>
  <rect x="330" y="356" width="180" height="52" rx="6" fill="#eef0fb" stroke="#3b47b8"/>
  <text x="342" y="376" font-weight="600">Remove the shorted part</text>
  <text x="342" y="392" fill="#4a4a52">See section 4.</text>
  <!-- step 5 -->
  <rect x="10" y="432" width="280" height="42" rx="6" fill="#f7f7f9" stroke="#cfcfd6"/>
  <text x="22" y="450" font-weight="600">5. Remove the thermistor</text>
  <text x="22" y="465" fill="#4a4a52">Desolder it, or lift it off with heat or tweezers.</text>
  <!-- question 3 -->
  <rect x="10" y="496" width="280" height="46" rx="6" fill="#ffffff" stroke="#3b47b8" stroke-width="1.5"/>
  <text x="150" y="516" text-anchor="middle" font-weight="600" fill="#3b47b8">6. Power only, no cables: does</text>
  <text x="150" y="531" text-anchor="middle" font-weight="600" fill="#3b47b8">a "No signal" message appear?</text>
  <rect x="330" y="496" width="180" height="46" rx="6" fill="#eef0fb" stroke="#3b47b8"/>
  <text x="342" y="515" font-weight="600">The panel is running</text>
  <text x="342" y="531" fill="#4a4a52">Reassemble.</text>
  <!-- end no -->
  <rect x="10" y="568" width="280" height="62" rx="6" fill="#f7f7f9" stroke="#cfcfd6"/>
  <text x="22" y="586" font-weight="600">Another fault behind the same symptom</text>
  <text x="22" y="602" fill="#4a4a52">A shorted part, a failed panel or a failed T-con.</text>
  <text x="22" y="616" fill="#4a4a52">See section 4.</text>
</svg>
