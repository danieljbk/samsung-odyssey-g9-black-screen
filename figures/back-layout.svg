<svg viewBox="0 0 520 250" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" font-size="11" fill="#26262b">
  <!-- monitor back -->
  <path d="M10,40 Q260,10 510,40 L510,230 Q260,205 10,230 Z" fill="#f7f7f9" stroke="#9a9aa5" stroke-width="1.3"/>
  <!-- stand mount -->
  <rect x="225" y="26" width="70" height="34" rx="3" fill="#ffffff" stroke="#cfcfd6"/>
  <text x="260" y="47" text-anchor="middle" fill="#6b6b76" font-size="10">stand mount</text>
  <!-- power board -->
  <rect x="30" y="62" width="130" height="100" rx="4" fill="#ffffff" stroke="#9a9aa5"/>
  <text x="95" y="102" text-anchor="middle" font-weight="600">Power board</text>
  <text x="95" y="118" text-anchor="middle" fill="#d03b3b" font-size="10" font-weight="600">mains voltage</text>
  <text x="95" y="132" text-anchor="middle" fill="#6b6b76" font-size="10">under a metal cover</text>
  <!-- T-con -->
  <rect x="195" y="78" width="130" height="78" rx="4" fill="#eef0fb" stroke="#3b47b8" stroke-width="2"/>
  <text x="260" y="108" text-anchor="middle" font-weight="600" fill="#3b47b8">T-con board</text>
  <text x="260" y="124" text-anchor="middle" fill="#3b47b8" font-size="10">the thermistor is here</text>
  <text x="260" y="138" text-anchor="middle" fill="#3b47b8" font-size="10">(figure 3)</text>
  <!-- main board -->
  <rect x="360" y="62" width="130" height="100" rx="4" fill="#ffffff" stroke="#9a9aa5"/>
  <text x="425" y="102" text-anchor="middle" font-weight="600">Main board</text>
  <text x="425" y="118" text-anchor="middle" fill="#6b6b76" font-size="10">inputs and ports,</text>
  <text x="425" y="132" text-anchor="middle" fill="#6b6b76" font-size="10">under a metal cover</text>
  <!-- ribbon cables -->
  <g stroke="#9a9aa5" stroke-width="6" stroke-linecap="butt">
    <line x1="230" y1="156" x2="230" y2="186"/>
    <line x1="290" y1="156" x2="290" y2="186"/>
  </g>
  <text x="335" y="178" fill="#6b6b76" font-size="10">fragile ribbon cables to the panel</text>
  <!-- panel-side boards under white strip -->
  <rect x="40" y="188" width="440" height="20" rx="3" fill="#ffffff" stroke="#9a9aa5" stroke-dasharray="4 3"/>
  <g fill="#e4e4e9" stroke="#9a9aa5">
    <rect x="60" y="192" width="80" height="12" rx="2"/>
    <rect x="160" y="192" width="80" height="12" rx="2"/>
    <rect x="280" y="192" width="80" height="12" rx="2"/>
    <rect x="380" y="192" width="80" height="12" rx="2"/>
  </g>
  <text x="260" y="242" text-anchor="middle" fill="#6b6b76" font-size="10">Panel-side boards along the bottom edge, under a white strip: where shorted capacitors have been found</text>
</svg>
