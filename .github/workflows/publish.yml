# Rebuilds report.pdf and the web page from report.md on every change to main,
# and publishes them with GitHub Pages at a link that never changes.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc and poppler
        run: sudo apt-get update && sudo apt-get install -y pandoc poppler-utils
      - name: Build the charts, the PDF and the web page
        run: python3 make_charts.py && python3 build_report.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
